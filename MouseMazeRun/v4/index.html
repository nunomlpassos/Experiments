<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <title>Mouse Maze Run</title>
    <link rel="stylesheet" href="styles.css?v=v4-test-reset-1" />
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="Game status">
        <div class="status-row">
          <h1 class="level-status">
            <span id="levelLabel">Level</span>
            <strong id="levelTitle">1</strong>
          </h1>
          <div class="attempt-status" id="attemptStatus" aria-label="7 attempts available">
            <span>Attempts</span>
            <div class="attempt-value">
              <strong id="attemptCount">7</strong>
              <small id="attemptTimer">MAX</small>
            </div>
          </div>
          <div class="stat currency-stat" id="currencyStatus" aria-label="100 shirt buttons">
            <span class="currency-icon" aria-hidden="true">
              <img src="assets/cash-button.png?v=campaign-53" alt="" draggable="false" />
            </span>
            <strong id="currencyCount">100</strong>
          </div>
        </div>
        <div class="stat moves-focus" id="movesStat">
          <strong id="movesLeft">0</strong>
          <span>Moves</span>
        </div>
        <button
          class="test-reset-button"
          id="testResetButton"
          type="button"
          aria-label="Reset test game"
          title="Reset test game"
        >
          &#8635;
        </button>
      </section>

      <section class="maze-wrap" aria-label="Maze board">
        <canvas
          id="maze"
          class="maze"
          role="application"
          aria-label="Maze board"
        ></canvas>
      </section>

      <section class="power-bar" id="powerBar" aria-label="Powers">
        <button
          class="power-button"
          id="crystalPowerButton"
          type="button"
          aria-label="Use crystal vision"
          aria-pressed="false"
          title="Crystal vision"
        >
          <span class="power-icon" aria-hidden="true">
            <img src="assets/crystal-power.png?v=campaign-53" alt="" draggable="false" />
          </span>
          <span class="power-count" id="crystalPowerCount" aria-hidden="true">1</span>
        </button>
        <button
          class="power-button"
          id="tornadoPowerButton"
          type="button"
          aria-label="Use maze tornado"
          aria-pressed="false"
          title="Maze tornado"
        >
          <span class="power-icon" aria-hidden="true">
            <img src="assets/tornado-power.png?v=campaign-53" alt="" draggable="false" />
          </span>
          <span class="power-count" id="tornadoPowerCount" aria-hidden="true">1</span>
        </button>
        <button
          class="power-button"
          id="hammerPowerButton"
          type="button"
          aria-label="Use wall hammer"
          aria-pressed="false"
          title="Wall hammer"
        >
          <span class="power-icon" aria-hidden="true">
            <img src="assets/hammer-power.png?v=campaign-53" alt="" draggable="false" />
          </span>
          <span class="power-count" id="hammerPowerCount" aria-hidden="true">1</span>
        </button>
        <button
          class="power-button fishing-power-button"
          id="fishingPowerButton"
          type="button"
          aria-label="Use fishing rod"
          aria-pressed="false"
          title="Fishing rod"
        >
          <span class="power-icon" aria-hidden="true">
            <img
              src="assets/fishing-power-transparent-v2.png?v=v2-fishing-upright-1"
              alt=""
              draggable="false"
            />
          </span>
          <span class="power-count" id="fishingPowerCount" aria-hidden="true">1</span>
        </button>
        <button
          class="power-button"
          id="rocketPowerButton"
          type="button"
          aria-label="Use mouse rocket"
          aria-pressed="false"
          title="Mouse rocket"
        >
          <span class="power-icon" aria-hidden="true">
            <img src="assets/rocket-power.png?v=campaign-53" alt="" draggable="false" />
          </span>
          <span class="power-count" id="rocketPowerCount" aria-hidden="true">1</span>
        </button>
      </section>

      <section class="movement-panel" id="movementPanel" aria-label="Movement controls" hidden>
        <div class="control-modes" role="group" aria-label="Control mode">
          <button
            class="mode-button active"
            id="swipeModeButton"
            type="button"
            aria-label="Use swipe controls"
            aria-pressed="true"
            title="Swipe controls"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 11V6a2 2 0 0 0-4 0v5" />
              <path d="M14 10V4a2 2 0 0 0-4 0v6" />
              <path d="M10 9.5V6a2 2 0 0 0-4 0v8" />
              <path d="M6 14v-2a2 2 0 0 0-4 0v2a8 8 0 0 0 8 8h2c4.4 0 8-3.6 8-8v-3a2 2 0 0 0-4 0v1" />
            </svg>
          </button>
          <button
            class="mode-button"
            id="arrowModeButton"
            type="button"
            aria-label="Use arrow controls"
            aria-pressed="false"
            title="Arrow controls"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2v20M2 12h20" />
              <path d="m15 5-3-3-3 3M15 19l-3 3-3-3M5 9l-3 3 3 3M19 9l3 3-3 3" />
            </svg>
          </button>
        </div>

        <div class="control-surface">
          <div
            class="swipe-pad"
            id="swipePad"
            role="application"
            aria-label="Swipe in a direction to move the mouse"
          >
            <span class="swipe-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3v18M3 12h18" />
                <path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3" />
              </svg>
            </span>
          </div>

          <div class="arrow-pad" id="arrowPad" aria-label="Directional buttons" hidden>
            <button class="direction-button up" id="moveUp" type="button" aria-label="Move up">&#8593;</button>
            <button class="direction-button left" id="moveLeft" type="button" aria-label="Move left">&#8592;</button>
            <button class="direction-button right" id="moveRight" type="button" aria-label="Move right">&#8594;</button>
            <button class="direction-button down" id="moveDown" type="button" aria-label="Move down">&#8595;</button>
          </div>
        </div>
      </section>

      <section
        class="power-shop"
        id="powerShop"
        role="dialog"
        aria-modal="true"
        aria-labelledby="powerShopTitle"
        hidden
      >
        <div class="shop-power-icon" aria-hidden="true">
          <img id="powerShopIcon" src="assets/crystal-power.png?v=campaign-53" alt="" />
        </div>
        <h2 id="powerShopTitle">Buy Crystal Vision</h2>
        <div class="shop-price" aria-label="Price">
          <span class="currency-icon" aria-hidden="true">
            <img src="assets/cash-button.png?v=campaign-53" alt="" draggable="false" />
          </span>
          <strong id="powerShopPrice">10</strong>
          <span>for 1 use</span>
        </div>
        <p class="shop-balance">
          Balance <strong id="powerShopBalance">100</strong>
        </p>
        <p class="shop-warning" id="powerShopWarning" hidden>Not enough shirt buttons.</p>
        <div class="shop-buttons">
          <button id="powerShopCancelButton" type="button">Close</button>
          <button id="powerShopBuyButton" type="button">Buy +1</button>
        </div>
      </section>

      <section class="controls" id="controlsPanel" aria-label="Level controls" hidden>
        <div class="stars" id="stars" aria-label="Star rating">☆ ☆ ☆</div>
        <p id="message" class="message">Study the maze, then swipe one cell at a time.</p>
        <div class="buttons">
          <button id="retryButton" type="button">Retry</button>
          <button id="nextButton" type="button" disabled>Next Level</button>
        </div>
      </section>
    </main>

    <script src="game.js?v=v4-test-reset-1"></script>
  </body>
</html>
